<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="Paper Processor Neo4j Explain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090f"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fffcf"/>
      <stop offset="0.5" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="820" height="220" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="816" height="216" rx="17" fill="none" stroke="#163" stroke-width="2"/>

  <!-- graph constellation -->
  <g filter="url(#glow)" stroke="url(#neon)" stroke-width="2.2" fill="none" opacity="0.9">
    <line x1="120" y1="110" x2="60"  y2="60"/>
    <line x1="120" y1="110" x2="60"  y2="160"/>
    <line x1="120" y1="110" x2="190" y2="60"/>
    <line x1="120" y1="110" x2="190" y2="160"/>
    <line x1="190" y1="60"  x2="190" y2="160"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="120" cy="110" r="13" fill="#0d141d" stroke="#5fffcf" stroke-width="3"/>
    <circle cx="60"  cy="60"  r="9"  fill="#0d141d" stroke="#7ab8ff" stroke-width="2.5"/>
    <circle cx="60"  cy="160" r="9"  fill="#0d141d" stroke="#9affae" stroke-width="2.5"/>
    <circle cx="190" cy="60"  r="9"  fill="#0d141d" stroke="#ffd45f" stroke-width="2.5"/>
    <circle cx="190" cy="160" r="9"  fill="#0d141d" stroke="#ff7ad9" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="260" y="92" font-family="ui-monospace,Menlo,monospace" font-size="40" font-weight="700" fill="url(#neon)" filter="url(#glow)">paper_processor</text>
  <text x="262" y="132" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#7aa">live pipeline → Neo4j → LAN</text>
  <text x="262" y="168" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4a7">🦞 what is the machine thinking right now?</text>

  <!-- lobster accent -->
  <text x="700" y="150" font-size="80" filter="url(#glow)">🦞</text>
</svg>
